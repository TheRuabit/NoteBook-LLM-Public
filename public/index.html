<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 批注工具</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>PDF 批注</h1>
  <span id="current-doc" class="muted"></span>
  <button id="btn-settings" class="ghost">⚙ 设置</button>
</header>

<main>
  <aside id="sidebar">
    <h2>文献 <span id="doc-count" class="muted"></span></h2>
    <select id="folder-filter" title="选择要浏览的文件夹，列表将只显示该文件夹下的文献"></select>
    <div class="dir-add">
      <input id="dir-input" placeholder="添加文献文件夹（绝对路径）" title="把系统中的文件夹加入文献库：支持 PDF 文章与 md 笔记混放、母文件夹内多级子文件夹自动识别">
      <button id="btn-add-dir">＋ 添加</button>
      <button id="btn-pick-dir" title="使用系统文件夹选择窗口添加文献库">📁 选择</button>
    </div>
    <ul id="doc-list"></ul>
  </aside>

  <section id="viewer">
    <div id="viewer-toolbar">
      <button id="btn-box" title="框选模式：在页面上拖拽矩形选择区域（类似截图工具），可连续框选多个，框内文本将作为 AI 上下文">▭ 框选</button>
      <button id="btn-box-clear" class="hidden" title="清除所有已框选区域">✕ 清除</button>
      <span id="box-hint" class="muted small hidden"></span>
      <span class="toolbar-separator"></span>
      <button id="btn-manual-highlight" disabled title="将当前选区写为黄色高亮">▰ 高亮</button>
      <input id="manual-note" disabled placeholder="输入批注内容">
      <button id="btn-manual-note" disabled title="将当前选区写为带文字的批注">💬 批注</button>
    </div>
    <div id="pages"></div>
  </section>

  <aside id="panel">
    <div class="tabs">
      <button id="tab-ai" class="tab active">AI</button>
      <button id="tab-notes" class="tab">笔记</button>
      <button id="tab-annotations" class="tab">批注</button>
    </div>

    <div id="tab-ai-body" class="tab-body">
      <div id="selection-info" class="muted small">在 PDF 中选中一段文字后点「问 AI」</div>
      <div id="selection-preview" class="selection-preview hidden"></div>
      <textarea id="prompt-input" placeholder="附加要求（可选）：如“结合我笔记中的 Flaw 部分批判这段”"></textarea>
      <div class="ask-mode">
        <label title="结合整篇论文的文本理解选中内容（较慢，全文会先提取）"><input type="radio" name="askmode" value="full"> 结合全文</label>
        <label title="结合选中内容所在页的上下文理解"><input type="radio" name="askmode" value="page"> 结合本页</label>
        <label title="仅根据框选内容回答（默认）"><input type="radio" name="askmode" value="selection" checked> 仅框选</label>
      </div>
      <button id="btn-ask" disabled>问 AI</button>
      <div id="answer" class="hidden">
        <div id="answer-body"></div>
        <div id="located-info" class="muted small"></div>
        <div class="btn-row">
          <button id="btn-annotate" class="primary">写入 PDF（高亮+批注）</button>
          <label id="chk-inline-label" class="small inline-opt" title="勾选后注释文字以小字直接绘制在页面上，任何 PDF 阅读器都能直接看到；不勾选则为可点击的批注图标（弹窗显示内容）">
            <input type="checkbox" id="chk-inline"> 注释直写页面（小字）
          </label>
          <button id="btn-save-notes">追加到笔记</button>
        </div>
      </div>
      <a id="download-link" class="hidden" download>下载标注版 PDF</a>
      <div id="error-box" class="error hidden"></div>
    </div>

    <div id="tab-notes-body" class="tab-body hidden">
      <div id="notes-list" class="muted small"></div>
      <textarea id="note-input" placeholder="手动记一条笔记（可选），或直接使用 AI 结果的「追加到笔记」"></textarea>
      <button id="btn-note-append">保存手动笔记</button>
    </div>

    <div id="tab-annotations-body" class="tab-body hidden">
      <div id="annotation-list" class="annotation-list muted small">打开 PDF 后可管理写入的批注。</div>
    </div>
  </aside>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2>LLM 设置</h2>
    <label>Base URL（OpenAI 兼容）</label>
    <input id="cfg-baseurl" placeholder="https://api.openai.com/v1">
    <label>API Key</label>
    <input id="cfg-apikey" type="password" placeholder="sk-...">
    <label>模型</label>
    <input id="cfg-model" placeholder="gpt-4o-mini">
    <div class="btn-row">
      <button id="btn-cfg-save" class="primary">保存</button>
      <button id="btn-cfg-cancel" class="ghost">取消</button>
    </div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
